<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Go AI — Human vs AI</title>
<style>
  body { font-family: -apple-system, Segoe UI, sans-serif; text-align: center;
         background: #1e1e1e; color: #eee; }
  #board { cursor: pointer; background: #dcb35c; border: 3px solid #8b5a2b;
           border-radius: 4px; }
  .controls { margin: 12px; }
  button { margin: 4px; padding: 8px 16px; font-size: 15px; cursor: pointer; }
  #status { font-size: 16px; margin-top: 6px; }
  label { margin: 0 8px; }
</style>
</head>
<body>
<h1>Go AI</h1>
<canvas id="board" width="570" height="570"></canvas>
<div class="controls">
  <label>You play:
    <select id="color">
      <option value="1">Black</option>
      <option value="2">White</option>
    </select>
  </label>
  <label>AI sims:
    <select id="sims">
      <option value="50">50</option>
      <option value="100" selected>100</option>
      <option value="200">200</option>
    </select>
  </label>
  <button onclick="passMove()">Pass</button>
  <button onclick="newGame()">New Game</button>
</div>
<div id="status"></div>

<script>
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
let state = null;
let size = 19;
const N = canvas.width;                 // canvas px
const margin = 30;
const step = (N - 2 * margin) / (size - 1);

function drawBoard() {
  ctx.clearRect(0, 0, N, N);
  ctx.fillStyle = '#dcb35c';
  ctx.fillRect(0, 0, N, N);
  ctx.strokeStyle = '#3a2a18';
  ctx.lineWidth = 1;
  for (let i = 0; i < size; i++) {
    const p = margin + i * step;
    ctx.beginPath(); ctx.moveTo(margin, p); ctx.lineTo(N - margin, p); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(p, margin); ctx.lineTo(p, N - margin); ctx.stroke();
  }
  // star points (9, 13, 19 boards)
  const stars = size === 19 ? [[3,3],[3,9],[3,15],[9,3],[9,9],[9,15],[15,3],[15,9],[15,15]]
              : size === 13 ? [[3,3],[3,9],[9,3],[9,9],[9,15],[15,3],[15,15]]
              : size === 9  ? [[2,2],[2,6],[4,4],[6,2],[6,6]] : [];
  ctx.fillStyle = '#3a2a18';
  for (const [r, c] of stars) {
    ctx.beginPath();
    ctx.arc(margin + c * step, margin + r * step, 3.5, 0, 2 * Math.PI);
    ctx.fill();
  }
}

function drawStones() {
  if (!state) return;
  const b = state.board;
  for (let r = 0; r < size; r++) {
    for (let c = 0; c < size; c++) {
      if (b[r][c] === 0) continue;
      ctx.beginPath();
      ctx.arc(margin + c * step, margin + r * step, step * 0.44, 0, 2 * Math.PI);
      ctx.fillStyle = b[r][c] === 1 ? '#111' : '#f5f5f5';
      ctx.fill();
      ctx.strokeStyle = '#555';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }
}

function render() {
  drawBoard();
  drawStones();
  const st = document.getElementById('status');
  if (!state) { st.textContent = 'Starting…'; return; }
  if (state.done) {
    st.textContent = state.winner === 0 ? 'Draw' :
      (state.winner === state.human_color ? 'You win!' : 'AI wins!');
  } else {
    st.textContent = state.current === state.human_color
      ? 'Your turn' : 'AI thinking…';
  }
}

async function post(path, body) {
  const r = await fetch(path, { method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {}) });
  if (!r.ok) { render(); return null; }
  return await r.json();
}

async function newGame() {
  const human_color = parseInt(document.getElementById('color').value);
  const sims = parseInt(document.getElementById('sims').value);
  const data = await post('/new_game', { size: 19, human_color, sims });
  if (data) { state = data.state; render(); }
}

canvas.addEventListener('click', async (e) => {
  if (!state || state.done || state.current !== state.human_color) return;
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (N / rect.width);
  const y = (e.clientY - rect.top) * (N / rect.height);
  const c = Math.round((x - margin) / step);
  const r = Math.round((y - margin) / step);
  if (r < 0 || r >= size || c < 0 || c >= size) return;
  const data = await post('/play', { row: r, col: c });
  if (data) { state = data.state; render(); }
});

async function passMove() {
  const data = await post('/pass', {});
  if (data) { state = data.state; render(); }
}

newGame();
</script>
</body>
</html>
